
name: Web Automation Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 
  
jobs:
  run-automation-test:

    runs-on: ubuntu-latest
    steps:
    # download repo
    - uses: actions/checkout@v4
    # setup java
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    # install browser
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v2.1.2

    # setup gradlew
    - name: Setup gradlew
      run: chmod +x gradlew

    # execute gradlew command for running cucumber test
    - name: Execute Test
      run: ./gradlew cucumber

    # archive test result
    - name: Archive Test Result
      uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: Cucumber Report
        path: build/reports/cucumber
        
    # deploy to github pages
    - name: Github Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v4.1.0
      with:
       personal_token: ${{ secrets.GITHUB_TOKEN }}
       publish_dir: build/reports/cucumber
